<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            overflow: hidden;
            position: relative;
        }

      
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 182, 193, 0.4);
            border-radius: 50%;
            animation: float 10s infinite ease-in;
        }

        .bubble:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; animation-duration: 8s; }
        .bubble:nth-child(2) { left: 25%; width: 150px; height: 150px; animation-delay: 2s; animation-duration: 12s; }
        .bubble:nth-child(3) { left: 60%; width: 50px; height: 50px; animation-delay: 1s; animation-duration: 6s; }
        .bubble:nth-child(4) { left: 80%; width: 110px; height: 110px; animation-delay: 4s; animation-duration: 10s; }

        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.2);
                opacity: 0;
            }
        }

      
        .login-container {
            position: relative;
            z-index: 2;
            width: 380px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 154, 162, 0.3);
            text-align: center;
            animation: fadeInCard 1s ease-out;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h2 {
            color: #ff5c8a;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
        }

        
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            color: #4a4a4a;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .input-group input:focus {
            border-color: #ff85a2;
            box-shadow: 0 0 12px rgba(255, 133, 162, 0.4);
        }

        .input-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            transition: 0.3s ease;
            pointer-events: none;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -10px;
            left: 10px;
            font-size: 0.85rem;
            padding: 0 5px;
            background: #fff;
            color: #ff5c8a;
            border-radius: 4px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 25px;
            color: #666;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .options input[type="checkbox"] {
            accent-color: #ff5c8a;
        }

        .options a {
            color: #ff5c8a;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff758f, #ff85a2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 143, 0.4);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: linear-gradient(45deg, #ff5c8a, #ff758f);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 92, 138, 0.6);
        }

        .signup-link {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
        }

        .signup-link a {
            color: #ff5c8a;
            text-decoration: none;
            font-weight: 600;
        }

        
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        
        .surprise-screen {
            position: absolute;
            z-index: 3;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            width: 100%;
            padding: 20px;
        }

        
        
        .surprise-text {
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 40px #ff5c8a,
                0 0 80px #ff5c8a;
            letter-spacing: 2px;
            line-height: 1.4;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        .heart {
            font-size: 5rem;
            color: #ff0055;
            margin-top: 20px;
            text-shadow: 0 0 20px #ff5c8a;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes textGlow {
            from {
                text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 30px #ff5c8a, 0 0 40px #ff5c8a;
                transform: scale(1);
            }
            to {
                text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 50px #ff5c8a, 0 0 70px #ff5c8a, 0 0 100px #ff5c8a;
                transform: scale(1.03);
            }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.25); }
            40% { transform: scale(1.1); }
            60% { transform: scale(1.25); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

  
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    
    <div class="login-container" id="loginCard">
        <h2>A suprisee for you .</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="input-group">
                
                <input type="text" id="username" required autocomplete="off">
                <label for="username">User ID</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" required>
                <label for="password">Password</label>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>

            <div class="signup-link">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </form>
    </div>

    
    <div class="surprise-screen" id="surpriseScreen">
        <h1 class="surprise-text">from my heart my love for you from rajveer .I LOVE YOU MERI JAAN</h1>
        <div class="heart">🥰💝</div>
    </div>

    
    <script>
        function handleLogin(event) {
            event.preventDefault(); 
            
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            
            const loginCard = document.getElementById('loginCard');
            const surpriseScreen = document.getElementById('surpriseScreen');

            
            if (usernameInput === "Richarana" && passwordInput === "8709855412") {
                
                
                loginCard.style.opacity = '0';
                loginCard.style.transform = 'translateY(-50px) scale(0.9)';
                
                
                setTimeout(() => {
                    loginCard.style.display = 'none';
                    surpriseScreen.style.display = 'flex';
                    
                  
                    setTimeout(() => {
                        surpriseScreen.style.opacity = '1';
                    }, 50);
                    
                }, 800);

            } else {
            
                loginCard.classList.add('shake');
                setTimeout(() => {
                    loginCard.classList.remove('shake');
                }, 400);
            }
        }
    </script>
</body>
</html>
